name: Update combined contribution graph

on:
  schedule:
    - cron: "17 12 * * 0" # weekly, Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate merged graph
        run: node scripts/generate-contributions.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg graphs README.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update combined contribution graph"
            git push
          fi
